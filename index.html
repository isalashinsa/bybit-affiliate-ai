
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bybit Affiliate AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px 15px;
      min-height: 100vh;
      background: #10131c;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 750px;
      margin: 40px auto;
      padding: 30px;
      background: #1b2030;
      border: 1px solid #30384d;
      border-radius: 16px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #aab2c5;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin: 20px 0 8px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border: 1px solid #414a60;
      border-radius: 8px;
      background: #111624;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 25px;
      border: none;
      border-radius: 8px;
      background: #f7a600;
      color: #111111;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      background: #111624;
      color: #c5cee0;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 20px;
      border-radius: 8px;
      background: #111624;
      border: 1px solid #414a60;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .small {
      margin-top: 20px;
      color: #8993aa;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Bybit Affiliate AI</h1>

    <p class="subtitle">
      Your AI assistant for TikTok and Facebook content
    </p>

    <label for="topic">Enter your topic</label>
    <input
      id="topic"
      type="text"
      placeholder="Example: Cryptocurrency for beginners"
    >

    <label for="platform">Choose your platform</label>
    <select id="platform">
      <option value="TikTok">TikTok</option>
      <option value="Facebook">Facebook</option>
    </select>

    <label for="contentType">Choose content type</label>
    <select id="contentType">
      <option value="Video script">Video script</option>
      <option value="Post">Social media post</option>
      <option value="Advertisement">Advertisement</option>
      <option value="Educational content">Educational content</option>
      <option value="Marketing ideas">Marketing ideas</option>
    </select>

    <button id="generateButton" onclick="generateContent()">
      Generate Content
    </button>

    <div id="status">
      Ready. Enter a topic to get started.
    </div>

    <div id="result"></div>

    <p class="small">
      AI-generated content should be checked before publishing.
      Cryptocurrency involves financial risk.
    </p>

  </div>

  <script>
    // SUPABASE CONNECTION
    const SUPABASE_URL =
      "https://hnkwfyxclycwdprpxndx.supabase.co";

    // SUPABASE PUBLISHABLE KEY
    const SUPABASE_ANON_KEY =
      "sb_publishable_EbKVI7NY3WbWxPvoSfINxQ_jpYe0N9G";


    function sleep(milliseconds) {
      return new Promise(resolve => setTimeout(resolve, milliseconds));
    }


    async function readResponse(response) {
      const responseText = await response.text();

      let data;

      try {
        data = responseText ? JSON.parse(responseText) : {};
      } catch {
        throw new Error(
          "The server returned an unexpected response: " +
          responseText.slice(0, 500)
        );
      }

      if (!response.ok) {
        const message =
          data.error ||
          data.message ||
          responseText ||
          "Request failed.";

        throw new Error(
          typeof message === "string"
            ? message
            : JSON.stringify(message)
        );
      }

      return data;
    }


    async function generateContent() {

      const topic = document.getElementById("topic").value.trim();
      const platform = document.getElementById("platform").value;
      const contentType =
        document.getElementById("contentType").value;

      const button = document.getElementById("generateButton");
      const status = document.getElementById("status");
      const result = document.getElementById("result");

      if (!topic) {
        status.textContent = "Please enter a topic first.";
        return;
      }

      if (
        !SUPABASE_ANON_KEY ||
        SUPABASE_ANON_KEY ===
        "PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE"
      ) {
        status.textContent =
          "Please add your Supabase publishable key in the code.";
        return;
      }

      button.disabled = true;
      button.textContent = "Generating...";
      result.style.display = "none";
      result.textContent = "";

      const headers = {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY
      };

      try {

        // STEP 1: START GENERATION

        status.textContent =
          "Sending your request to the AI...";

        const startResponse = await fetch(
          SUPABASE_URL + "/functions/v1/generate-content",
          {
            method: "POST",
            headers: headers,
            body: JSON.stringify({
              topic: topic,
              contentType: platform + " " + contentType
            })
          }
        );

        const startData = await readResponse(startResponse);

        if (!startData.interactionId) {
          throw new Error(
            startData.error ||
            "The AI did not return a generation ID."
          );
        }

        const interactionId = startData.interactionId;


        // STEP 2: CHECK GENERATION STATUS

        // Gradually increase the waiting time.
        // Maximum scheduled waiting time is approximately 4 minutes 46 seconds.

        const delays = [3000, 5000, 8000, 10000];

        for (let attempt = 0; attempt < 30; attempt++) {

          await sleep(
            delays[Math.min(attempt, delays.length - 1)]
          );

          status.textContent =
            "The AI is working on your content...\n" +
            "Checking progress: " + (attempt + 1) + " / 30\n" +
            "Please keep this page open.";

          const checkResponse = await fetch(
            SUPABASE_URL + "/functions/v1/check-content",
            {
              method: "POST",
              headers: headers,
              body: JSON.stringify({
                interactionId: interactionId
              })
            }
          );

          const checkData = await readResponse(checkResponse);


          // GENERATION COMPLETED

          if (checkData.status === "completed") {

            if (!checkData.text) {
              throw new Error(
                "The AI completed the request, but no text was returned."
              );
            }

            result.textContent = checkData.text;
            result.style.display = "block";

            status.textContent =
              "Content generated successfully!";

            return;
          }


          // GENERATION FAILED

          if (checkData.status === "failed") {
            throw new Error(
              checkData.error ||
              "The AI generation failed."
            );
          }


          // STILL GENERATING

          if (checkData.status !== "in_progress") {
            throw new Error(
              "Unexpected AI status: " +
              JSON.stringify(checkData)
            );
          }

        }


        // TIME LIMIT REACHED

        status.textContent =
          "Generation is taking longer than expected.\n\n" +
          "The AI may still be working in the background. " +
          "Please do not repeatedly click Generate Content. " +
          "You can try again later.";

      } catch (error) {

        console.error("Generation error:", error);

        status.textContent =
          "Something went wrong:\n\n" + error.message;

      } finally {

        button.disabled = false;
        button.textContent = "Generate Content";

      }

    }

  </script>

</body>
</html>
